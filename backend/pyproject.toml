[project]
name = "chef-backend"
version = "0.1.0"
description = "Chef API: pantry, recipes and recommendations"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=25.1.0",
    "cryptography>=43",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "pyjwt>=2.15.1",
    "pymysql>=1.1",
    "rapidfuzz>=3.14.6",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
